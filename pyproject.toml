[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jukebox-hic"
version = "0.1.0"
description = "Lightweight Hi-C noise analysis toolkit using hicstraw"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "NoiseSampler Developers"}
]
dependencies = [
  "hic-straw>=1.3.1",
  "numpy>=1.21",
  "pandas>=1.3",
  "statsmodels>=0.13",
  "matplotlib>=3.5",
  "cooler>=0.9.3",
  "scipy>=1.8"
]

[project.optional-dependencies]
profile = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/timrez/NoiseSampler"

[project.scripts]
jukebox-hic = "jukebox_hic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
